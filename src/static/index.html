<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多智能体协作系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header h1 { font-size: 22px; margin-bottom: 4px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .input-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .input-section label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .input-section textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }
        .input-section textarea:focus { border-color: #667eea; }
        .input-section button {
            margin-top: 12px;
            padding: 10px 28px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .input-section button:hover { background: #5568d3; }
        .input-section button:disabled { background: #ccc; cursor: not-allowed; }
        .agents-info {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .agent-card {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
        }
        .agent-card.planner { background: #e6f7ff; border: 1px solid #91d5ff; }
        .agent-card.researcher { background: #f6ffed; border: 1px solid #b7eb8f; }
        .agent-card.writer { background: #fff7e6; border: 1px solid #ffd591; }
        .agent-card .icon { font-size: 24px; margin-bottom: 4px; }
        .agent-card .name { font-weight: bold; }
        .agent-card .role { color: #666; font-size: 12px; }
        .collaboration-section {
            display: none;
        }
        .collaboration-section.show { display: block; }
        .step-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #667eea;
        }
        .step-card.planner { border-left-color: #1890ff; }
        .step-card.researcher { border-left-color: #52c41a; }
        .step-card.writer { border-left-color: #fa8c16; }
        .step-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .step-icon { font-size: 28px; }
        .step-info h3 { font-size: 16px; color: #333; }
        .step-info .time { font-size: 12px; color: #999; }
        .step-content {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.8;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .final-report {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 2px solid #667eea;
        }
        .final-report h2 {
            color: #667eea;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .final-report .report-content {
            line-height: 1.8;
            font-size: 14px;
        }
        .final-report .report-content h2 {
            color: #667eea;
            margin: 20px 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
            font-size: 18px;
        }
        .final-report .report-content h3 {
            color: #333;
            margin: 16px 0 10px;
            font-size: 16px;
        }
        .final-report .report-content h4 {
            color: #555;
            margin: 12px 0 8px;
            font-size: 15px;
        }
        .final-report .report-content p {
            margin-bottom: 12px;
            text-indent: 2em;
        }
        .final-report .report-content ul,
        .final-report .report-content ol {
            margin: 10px 0 10px 2em;
        }
        .final-report .report-content li {
            margin-bottom: 6px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-bar {
            background: #f0f5ff;
            border: 1px solid #adc6ff;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #2f54eb;
        }
        .upload-section {
            background: #f9f9f9;
            border: 2px dashed #d9d9d9;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
        }
        .upload-section:hover { border-color: #667eea; }
        .upload-section input[type="file"] { display: none; }
        .upload-btn {
            display: inline-block;
            padding: 8px 20px;
            background: #52c41a;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .upload-btn:hover { background: #389e0d; }
        .upload-status {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
        }
        .upload-status.success { color: #52c41a; }
        .upload-status.error { color: #ff4d4f; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 多智能体协作系统</h1>
        <p>规划员 + 研究员 + 写作员，三个智能体协作完成复杂任务</p>
    </div>

    <div class="container">
        <div class="input-section">
            <div class="upload-section">
                <label for="fileInput" class="upload-btn">📁 上传文档到知识库</label>
                <input type="file" id="fileInput" accept=".txt,.pdf,.docx,.xlsx,.xls" onchange="uploadFile()">
                <div style="margin-top: 10px;">
                    <label style="font-size: 13px; color: #666; cursor: pointer;">
                        <input type="checkbox" id="useOcr" style="margin-right: 5px;">
                        启用 OCR 识别（PDF 含图片/扫描件时勾选，会变慢）
                    </label>
                </div>
                <div class="upload-status" id="uploadStatus">支持 .txt / .pdf / .docx / .xlsx / .xls 格式，上传后研究员可查询知识库</div>
            </div>

            <label for="taskInput">请输入你的任务：</label>
            <textarea id="taskInput" placeholder="例如：帮我分析一下AI Agent的发展趋势，并给出一份研究报告"></textarea>
            <button onclick="submitTask()" id="submitBtn">开始协作</button>

            <div class="agents-info">
                <div class="agent-card planner">
                    <div class="icon">📋</div>
                    <div class="name">规划员</div>
                    <div class="role">拆解任务，分配工作</div>
                </div>
                <div class="agent-card researcher">
                    <div class="icon">🔬</div>
                    <div class="name">研究员</div>
                    <div class="role">深入分析，查找资料</div>
                </div>
                <div class="agent-card writer">
                    <div class="icon">✍️</div>
                    <div class="name">写作员</div>
                    <div class="role">整理结果，撰写报告</div>
                </div>
            </div>
        </div>

        <div id="loadingSection" style="display:none;">
            <div class="loading">
                <div class="spinner"></div>
                <div id="loadingText">智能体团队正在协作中...</div>
            </div>
        </div>

        <div id="resultSection" class="collaboration-section">
            <div class="status-bar" id="statusBar"></div>
            <div id="collaborationLog"></div>
            <div id="finalReport"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8002';

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const statusEl = document.getElementById('uploadStatus');
            const useOcr = document.getElementById('useOcr').checked;

            if (!fileInput.files || fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            statusEl.className = 'upload-status';
            statusEl.textContent = `正在上传 "${file.name}"${useOcr ? '（OCR识别中，可能较慢）...' : '...'}`;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const url = `${API_BASE}/upload?use_ocr=${useOcr}`;
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (response.ok) {
                    statusEl.className = 'upload-status success';
                    statusEl.textContent = `✅ ${result.message}`;
                } else {
                    statusEl.className = 'upload-status error';
                    statusEl.textContent = `❌ 上传失败：${result.detail || '未知错误'}`;
                }
            } catch (error) {
                statusEl.className = 'upload-status error';
                statusEl.textContent = `❌ 网络错误：${error.message}`;
            }

            fileInput.value = '';
        }

        async function submitTask() {
            const task = document.getElementById('taskInput').value.trim();
            if (!task) {
                alert('请输入任务内容');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '协作中...';

            document.getElementById('loadingSection').style.display = 'block';
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('collaborationLog').innerHTML = '';
            document.getElementById('finalReport').innerHTML = '';

            const loadingTexts = [
                '📋 规划员正在分析任务...',
                '🔬 研究员正在深入研究...',
                '✍️ 写作员正在撰写报告...'
            ];
            let textIndex = 0;
            const textInterval = setInterval(() => {
                document.getElementById('loadingText').textContent = loadingTexts[textIndex % 3];
                textIndex++;
            }, 3000);

            try {
                const response = await fetch(`${API_BASE}/task`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task })
                });
                const result = await response.json();

                clearInterval(textInterval);
                document.getElementById('loadingSection').style.display = 'none';

                if (response.ok) {
                    showResult(result);
                } else {
                    alert('出错了: ' + (result.detail || '未知错误'));
                }
            } catch (error) {
                clearInterval(textInterval);
                document.getElementById('loadingSection').style.display = 'none';
                alert('网络错误: ' + error.message + '（请确认后端服务已启动，端口8002）');
            }

            btn.disabled = false;
            btn.textContent = '开始协作';
        }

        function showResult(result) {
            document.getElementById('resultSection').classList.add('show');

            document.getElementById('statusBar').innerHTML =
                `✅ 协作完成！共调用 <b>${result.agents_used}</b> 个智能体，总耗时 <b>${result.duration.toFixed(2)}秒</b>` +
                (result.rag_enabled ? ` | 📚 RAG知识库：${result.rag_available ? '已接入' : '未连接'}` : '');

            const logContainer = document.getElementById('collaborationLog');
            result.collaboration_log.forEach((log, index) => {
                const agentClass = log.agent === '规划员' ? 'planner' :
                                   log.agent === '研究员' ? 'researcher' : 'writer';
                const icon = log.agent === '规划员' ? '📋' :
                            log.agent === '研究员' ? '🔬' : '✍️';

                const card = document.createElement('div');
                card.className = `step-card ${agentClass}`;
                card.innerHTML = `
                    <div class="step-header">
                        <div class="step-icon">${icon}</div>
                        <div class="step-info">
                            <h3>第 ${index + 1} 步：${log.agent} - ${log.action}</h3>
                            <div class="time">${log.timestamp}</div>
                        </div>
                    </div>
                    <div class="step-content">${escapeHtml(log.output)}</div>
                `;
                logContainer.appendChild(card);
            });

            const reportDiv = document.getElementById('finalReport');
            reportDiv.innerHTML = `
                <div class="final-report">
                    <h2>📄 最终报告</h2>
                    <div class="report-content">${renderMarkdown(result.final_report)}</div>
                </div>
            `;

            reportDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderMarkdown(text) {
            let html = escapeHtml(text);
            // 标题
            html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
            html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');
            // 加粗
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // 斜体
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            // 无序列表
            html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
            // 有序列表
            html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
            // 段落（空行分隔）
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';
            // 清理多余的空标签
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<p><h/g, '<h');
            html = html.replace(/<\/h\d><\/p>/g, '</h2>');
            return html;
        }
    </script>
</body>
</html>
